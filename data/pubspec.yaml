name: data
description: "Data layer package for flutter_bloc_architecture (provides repositories, models, and remote/local data sources)."
version: 0.0.1
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  dartz:
    git:
      url: https://github.com/rahul-gola/dartz.git

  dio: ^5.9.1
  domain:
    path: ../domain

  flutter:
    sdk: flutter

  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.9.2
  riverpod: 3.2.1

dev_dependencies:
  build_runner: ^2.11.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

  json_serializable: ^6.12.0
  retrofit_generator: ^10.2.3
