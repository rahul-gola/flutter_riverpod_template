version: 0.0.1
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  dartz:
    git:
      url: https://github.com/rahul-gola/dartz.git

  flutter:
    sdk: flutter

  riverpod: 3.2.1
  json_annotation: ^4.10.0

dev_dependencies:
  build_runner: ^2.11.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

  json_serializable: ^6.12.0