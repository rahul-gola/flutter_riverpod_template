name: flutter_riverpod_template
description: A Flutter template project with Riverpod state management and clean architecture setup.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.0.3+1

environment:
  sdk: ^3.9.2

dependencies:

  cupertino_icons: ^1.0.8
  dartz:
    git:
      url: https://github.com/rahul-gola/dartz.git
  flutter:
    sdk: flutter
  data:
    path: data
  domain:
    path: domain
  flutter_screenutil: ^5.9.3
  flutter_riverpod: ^3.0.3
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/