name: flutter_riverpod_template
description: A Flutter template project with Riverpod state management and clean architecture setup.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.0.4+1
homepage: https://github.com/rahul-gola/flutter_riverpod_template
repository: https://github.com/rahul-gola/flutter_riverpod_template

environment:
  sdk: ^3.11.0

dependencies:
  cupertino_icons: ^1.0.8
  dartz:
    git:
      url: https://github.com/rahul-gola/dartz.git

  flutter:
    sdk: flutter

  data:
    path: data

  domain:
    path: domain

  flutter_screenutil: ^5.9.3
  flutter_riverpod: ^3.2.1
  equatable: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - path: assets/images/